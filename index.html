<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Official Video Downloader</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: '#e11d48', /* Merah elegan (Rose-600) */
                        primaryDark: '#be123c', /* Merah gelap */
                        surface: '#ffffff',
                        surfaceDark: '#18181b',
                        bgDark: '#09090b'
                    }
                }
            }
        }
    </script>
    <!-- Custom CSS -->
    <style>
        /* Sembunyikan scrollbar untuk carousel history tapi tetap bisa discroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(225, 29, 72, 0.2);
            border-top-color: #e11d48;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Smooth Toast */
        .toast-enter { animation: toastIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .toast-exit { animation: toastOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(100%) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(20px) scale(0.9); } }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-bgDark dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col antialiased selection:bg-primary selection:text-white">

    <!-- Header / Navbar -->
    <header class="w-full sticky top-0 z-40 bg-white/80 dark:bg-surfaceDark/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-screen-md mx-auto px-4 h-16 flex justify-between items-center">
            <!-- Logo & Title (Kiri Atas) -->
            <div class="flex items-center gap-3">
                <!-- Ganti atribut src di bawah dengan link URL foto/logo Anda -->
                <img src="https://placehold.co/100x100/e11d48/white?text=Logo" alt="Logo Official" class="w-9 h-9 rounded-full object-cover border-2 border-primary shadow-sm">
                <h1 class="text-lg font-bold tracking-tight">Official<span class="text-primary">DL</span></h1>
            </div>
            
            <!-- Theme Toggle -->
            <button id="theme-toggle" class="p-2.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors active:scale-95">
                <i data-lucide="moon" id="theme-icon" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content App-Like Layout -->
    <main class="flex-grow w-full max-w-screen-md mx-auto px-4 py-6 md:py-10 flex flex-col gap-8">
        
        <!-- Hero Section -->
        <div class="text-center px-2">
            <h2 class="text-2xl md:text-4xl font-extrabold mb-3 leading-tight">Unduh Video <br><span class="text-primary">Tanpa Batas</span></h2>
            <p class="text-sm md:text-base text-gray-500 dark:text-gray-400">Simpan video resolusi tinggi & audio MP3 ke perangkat Anda dengan satu klik.</p>
        </div>

        <!-- Input Area (Mobile Optimized Form) -->
        <div class="bg-white dark:bg-surfaceDark p-3 rounded-3xl shadow-sm border border-gray-200 dark:border-gray-800 focus-within:ring-2 focus-within:ring-primary/50 transition-all">
            <form id="download-form" class="flex flex-col gap-3">
                <div class="relative flex items-center">
                    <div class="absolute left-4 text-gray-400">
                        <i data-lucide="link" class="w-5 h-5"></i>
                    </div>
                    <input type="url" id="tiktok-url" required 
                           placeholder="Tempel tautan video di sini..." 
                           class="w-full pl-12 pr-4 py-4 rounded-2xl bg-gray-50 dark:bg-bgDark border-none focus:ring-0 text-base outline-none">
                </div>
                <button type="submit" id="submit-btn" 
                        class="w-full bg-primary hover:bg-primaryDark text-white font-bold py-4 rounded-2xl flex justify-center items-center gap-2 transition-transform active:scale-[0.98] shadow-lg shadow-primary/30">
                    <i data-lucide="arrow-down-to-line" class="w-5 h-5"></i>
                    <span>Proses Video</span>
                </button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loader" class="hidden flex-col items-center justify-center py-10">
            <div class="spinner mb-4"></div>
            <p class="text-sm text-gray-500 dark:text-gray-400 font-medium animate-pulse">Menghubungkan ke server...</p>
        </div>

        <!-- Result Card (Clean UI) -->
        <div id="result-section" class="hidden animate-fade-in">
            <div class="bg-white dark:bg-surfaceDark rounded-3xl p-4 md:p-6 shadow-sm border border-gray-200 dark:border-gray-800">
                <div class="flex flex-col gap-5">
                    
                    <!-- User & Title Info -->
                    <div class="flex items-start gap-4">
                        <img id="res-cover" src="" alt="Cover" class="w-20 h-28 object-cover rounded-xl shadow-sm flex-shrink-0 bg-gray-200">
                        <div class="flex-grow min-w-0">
                            <h3 id="res-author" class="text-sm font-bold text-primary truncate mb-1">@username</h3>
                            <p id="res-title" class="text-sm md:text-base text-gray-700 dark:text-gray-200 line-clamp-3 leading-snug">Deskripsi video akan muncul di sini memotong jika terlalu panjang.</p>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="grid grid-cols-1 gap-3 pt-2">
                        <a id="btn-dl-video-hd" href="#" target="_blank" class="w-full flex items-center justify-between bg-primary text-white font-semibold py-3.5 px-5 rounded-2xl hover:bg-primaryDark transition active:scale-[0.98]">
                            <div class="flex items-center gap-3"><i data-lucide="video" class="w-5 h-5"></i> MP4 High Quality (HD)</div>
                            <i data-lucide="chevron-right" class="w-5 h-5 opacity-70"></i>
                        </a>
                        <a id="btn-dl-video" href="#" target="_blank" class="w-full flex items-center justify-between bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white font-semibold py-3.5 px-5 rounded-2xl hover:bg-gray-200 dark:hover:bg-gray-700 transition active:scale-[0.98]">
                            <div class="flex items-center gap-3"><i data-lucide="smartphone" class="w-5 h-5"></i> MP4 Standard (SD)</div>
                        </a>
                        <a id="btn-dl-audio" href="#" target="_blank" class="w-full flex items-center justify-between border-2 border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 font-semibold py-3.5 px-5 rounded-2xl hover:border-primary dark:hover:border-primary transition active:scale-[0.98]">
                            <div class="flex items-center gap-3"><i data-lucide="music" class="w-5 h-5 text-primary"></i> Download Audio (MP3)</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Section (Mobile Swipeable Carousel) -->
        <div id="history-section" class="hidden flex-col gap-3">
            <div class="flex justify-between items-end px-1">
                <h3 class="text-base font-bold">Riwayat Anda</h3>
                <button id="clear-history" class="text-xs font-semibold text-primary py-1 px-2 rounded-lg bg-red-50 dark:bg-red-900/20 active:scale-95 transition">Bersihkan</button>
            </div>
            <!-- Container Swipe Horizontal -->
            <div id="history-list" class="flex gap-4 overflow-x-auto no-scrollbar snap-x snap-mandatory pb-2">
                <!-- Injected via JS -->
            </div>
        </div>

    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-20 right-0 left-0 flex flex-col items-center gap-2 z-50 pointer-events-none px-4"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // DOM Elements
            const form = document.getElementById('download-form');
            const inputUrl = document.getElementById('tiktok-url');
            const submitBtn = document.getElementById('submit-btn');
            const loader = document.getElementById('loader');
            const resultSection = document.getElementById('result-section');
            
            const resCover = document.getElementById('res-cover');
            const resTitle = document.getElementById('res-title');
            const resAuthor = document.getElementById('res-author');
            const btnVideoHd = document.getElementById('btn-dl-video-hd');
            const btnVideo = document.getElementById('btn-dl-video');
            const btnAudio = document.getElementById('btn-dl-audio');

            const historySection = document.getElementById('history-section');
            const historyList = document.getElementById('history-list');
            const clearHistoryBtn = document.getElementById('clear-history');

            // Theme Management
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const htmlTag = document.documentElement;

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlTag.classList.add('dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();

            themeToggle.addEventListener('click', () => {
                htmlTag.classList.toggle('dark');
                const isDark = htmlTag.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                lucide.createIcons();
            });

            // Modern Toast Notification (Top Center for better visibility on mobile)
            const showToast = (message, type = 'success') => {
                const toastContainer = document.getElementById('toast-container');
                const toast = document.createElement('div');
                const bgColor = type === 'success' ? 'bg-gray-900 dark:bg-white text-white dark:text-gray-900' : 'bg-red-500 text-white';
                
                toast.className = `${bgColor} px-5 py-3 rounded-full shadow-lg flex items-center gap-2 toast-enter font-medium text-sm`;
                toast.innerHTML = `
                    <i data-lucide="${type === 'success' ? 'check' : 'alert-circle'}" class="w-4 h-4"></i>
                    <span>${message}</span>
                `;
                toastContainer.appendChild(toast);
                lucide.createIcons();

                setTimeout(() => {
                    toast.classList.replace('toast-enter', 'toast-exit');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            };

            // History Management (Carousel Layout)
            let history = JSON.parse(localStorage.getItem('offdl_history')) || [];

            const renderHistory = () => {
                if (history.length === 0) {
                    historySection.classList.add('hidden');
                    return;
                }
                historySection.classList.remove('hidden');
                historyList.innerHTML = '';
                
                history.slice(0, 10).forEach(item => {
                    const div = document.createElement('div');
                    // Mobile specific styling for swipeable cards
                    div.className = 'relative flex-shrink-0 w-28 aspect-[9/16] rounded-2xl overflow-hidden shadow-sm bg-gray-200 dark:bg-gray-800 snap-center cursor-pointer group';
                    div.innerHTML = `
                        <img src="${item.cover}" alt="cover" class="w-full h-full object-cover">
                        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 to-transparent p-2 pt-8">
                            <span class="text-white font-semibold text-[10px] truncate block">@${item.author}</span>
                        </div>
                    `;
                    div.addEventListener('click', () => {
                        inputUrl.value = item.url;
                        form.dispatchEvent(new Event('submit'));
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                    historyList.appendChild(div);
                });
            };

            const saveToHistory = (data, url) => {
                history = history.filter(h => h.url !== url);
                history.unshift({
                    url: url,
                    cover: data.cover,
                    author: data.author_username
                });
                localStorage.setItem('offdl_history', JSON.stringify(history));
                renderHistory();
            };

            clearHistoryBtn.addEventListener('click', () => {
                history = [];
                localStorage.removeItem('offdl_history');
                renderHistory();
                showToast('Riwayat berhasil dibersihkan', 'success');
            });

            renderHistory();

            // API Fetch
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const url = inputUrl.value.trim();
                if (!url) return;

                resultSection.classList.add('hidden');
                loader.classList.remove('hidden');
                submitBtn.disabled = true;
                
                // Change button state
                const btnOriginalHtml = submitBtn.innerHTML;
                submitBtn.innerHTML = `<div class="spinner !w-5 !h-5 !border-2 !border-white/20 !border-t-white"></div> Memproses...`;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

                try {
                    const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
                    const rawResult = await response.json();

                    if (rawResult.code === -1 || !rawResult.data) {
                        throw new Error('Video privat atau tidak ditemukan.');
                    }

                    const data = {
                        title: rawResult.data.title,
                        author: rawResult.data.author.nickname,
                        author_username: rawResult.data.author.unique_id,
                        cover: rawResult.data.cover,
                        video_hd: rawResult.data.hdplay || rawResult.data.play,
                        video_no_watermark: rawResult.data.play,
                        audio: rawResult.data.music
                    };

                    resCover.src = data.cover;
                    resTitle.textContent = data.title || 'Tanpa judul';
                    resAuthor.textContent = `@${data.author_username}`;
                    
                    btnVideoHd.href = data.video_hd || data.video_no_watermark;
                    btnVideo.href = data.video_no_watermark;
                    btnAudio.href = data.audio;

                    loader.classList.add('hidden');
                    resultSection.classList.remove('hidden');
                    showToast('Berhasil mendapatkan video!');
                    saveToHistory(data, url);

                } catch (error) {
                    loader.classList.add('hidden');
                    showToast(error.message, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = btnOriginalHtml;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                }
            });
        });
    </script>
</body>
</html>
